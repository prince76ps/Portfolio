<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Prince 💙</title>
<style>
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
  font-family:Arial,sans-serif; color:white; text-align:center; overflow:hidden;
  background:linear-gradient(135deg,#061b3a,#123c69,#5b2a86);
}
.card{
  width:min(90%,650px); padding:38px 25px; border-radius:28px;
  background:rgba(255,255,255,.13); backdrop-filter:blur(12px);
  box-shadow:0 20px 60px rgba(0,0,0,.35);
}
h1{font-size:clamp(2.2rem,9vw,4.5rem); margin:0 0 12px}
h2{font-size:1.5rem; margin:8px 0 22px}
p{font-size:1.1rem; line-height:1.7; margin:10px auto; max-width:520px}
button{
  margin-top:22px; padding:14px 25px; border:0; border-radius:999px;
  font-size:1rem; font-weight:bold; cursor:pointer; color:#17345f;
}
#surprise{display:none;margin-top:22px;font-size:1.2rem}
.heart{
  position:fixed; bottom:-40px; font-size:25px; animation:float 5s linear forwards;
  pointer-events:none;
}
@keyframes float{
  from{transform:translateY(0) rotate(0deg);opacity:1}
  to{transform:translateY(-110vh) rotate(360deg);opacity:0}
}
</style>
</head>
<body>
<div class="card">
  <div style="font-size:3rem">🎉🎂💙</div>
  <h1>Happy Birthday, Prince!</h1>
  <h2>🥳 Wishing you an amazing day!</h2>

  <p>
    No matter how much we argue or tease, you'll always be my brother
    and I'll always be there for you.
  </p>

  <p><b>Keep smiling. Keep shining. Keep being awesome! 💙</b></p>

  <button onclick="showSurprise()">Click for a Surprise 🎁</button>

  <div id="surprise">
    🎈🎊✨ Lots of happiness, laughter and unforgettable moments! ✨🎊🎈
  </div>
</div>

<script>
function showSurprise(){
  document.getElementById("surprise").style.display="block";
  for(let i=0;i<35;i++){
    const h=document.createElement("div");
    h.className="heart";
    h.innerHTML=["💙","✨","🎉","🎈","🎂"][Math.floor(Math.random()*5)];
    h.style.left=Math.random()*100+"vw";
    h.style.animationDuration=(3+Math.random()*4)+"s";
    h.style.animationDelay=Math.random()*1.5+"s";
    document.body.appendChild(h);
    setTimeout(()=>h.remove(),8000);
  }
}
</script>
</body>
</html>
